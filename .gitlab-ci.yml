.defaults: &defaults
    image: docker
    stage: deploy
    when: manual
    services:
        - docker:dind
    before_script:
        - apk add --update git openssh aws-cli
        - aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${DOCKER_REPO}
        - echo "${EC2_SSH_KEY}" | base64 -d > ./ssh_key
        - chmod 600 ./ssh_key
        - eval "$(ssh-agent -s)"
        - ssh-add ./ssh_key
    after_script:
        - ssh -i ./ssh_key -o StrictHostKeyChecking=no ${EC2_DEPLOY_TARGET} "docker restart pimasi-gateway 2>/dev/null || true"
    rules:
        - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

deploy-stores:
    <<: *defaults
    variables:
        TARGET: prod
    script:
        - SERVICES="apollo-postgres" .ops/build-and-push.sh
        - SERVICES="apollo-redis apollo-clickhouse apollo-postgres" DEPLOY_TARGET=${EC2_DEPLOY_TARGET} .ops/deploy-apollo.sh

deploy-rm-crawler:
    <<: *defaults
    variables:
        TARGET: prod
    script:
        - SERVICES="apollo-server apollo-proxy" .ops/build-and-push.sh
        - SERVICES="apollo-rm-crawler apollo-proxy" DEPLOY_TARGET=${EC2_DEPLOY_TARGET} .ops/deploy-apollo.sh

deploy-server:
    <<: *defaults
    variables:
        TARGET: prod
    script:
        - SERVICES="apollo-server" .ops/build-and-push.sh
        - SERVICES="apollo-cron apollo-workers apollo-server" DEPLOY_TARGET=${EC2_DEPLOY_TARGET} .ops/deploy-apollo.sh
