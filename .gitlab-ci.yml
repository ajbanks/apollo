.defaults: &defaults
    image: docker
    stage: deploy
    when: manual
    services:
        - docker:dind
    before_script:
        - apk add --update git openssh
        # - apk add --update git openssh-client-default=9.3_p2-r0 openssh=9.3_p2-r0
        - docker login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD}
        - echo "${PIMASI_001_KEY}" | base64 -d > ./ssh_key
        - chmod 600 ./ssh_key
        - eval "$(ssh-agent -s)"
        - ssh-add ./ssh_key
    after_script:
        - ssh -i ./ssh_key -o StrictHostKeyChecking=no ${PIMASI_001_SERVER} "docker restart pimasi-gateway"
    rules:
        - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

deploy-stores:
    <<: *defaults
    variables:
        TARGET: prod
    script:
        - SERVICES="apollo-postgres" .ops/build-and-push.sh
        - SERVICES="apollo-redis apollo-clickhouse apollo-postgres" DEPLOY_TARGET=${PIMASI_001_SERVER} .ops/deploy-apollo.sh

deploy-rm-crawler:
    <<: *defaults
    variables:
        TARGET: prod
    script:
        - SERVICES="apollo-server apollo-proxy" .ops/build-and-push.sh
        - SERVICES="apollo-rm-crawler apollo-proxy" DEPLOY_TARGET=${PIMASI_001_SERVER} .ops/deploy-apollo.sh

deploy-server:
    <<: *defaults
    variables:
        TARGET: prod
    script:
        - SERVICES="apollo-server" .ops/build-and-push.sh
        - SERVICES="apollo-cron apollo-workers apollo-server" DEPLOY_TARGET=${PIMASI_001_SERVER} .ops/deploy-apollo.sh
